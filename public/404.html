<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Page Not Found | BOTLYTICES</title>
    <meta name="description" content="The page you requested could not be found. Browse our technical service divisions or return to the home page." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/assets/images/botlytices-tab-logo.png" />
    <script>
      // Single Page App redirect for static hosts (GitHub Pages)
      // Stores path in sessionStorage and redirects to root
      var pathSegmentsToKeep = 0;
      var l = window.location;
      if (l.pathname !== '/404.html') {
        sessionStorage.redirect = l.pathname + l.search + l.hash;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #FFFFFF;
        color: #0A1020;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 600px;
        padding: 40px 24px;
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        background-color: #F3F7FC;
        color: #0052CC;
        font-size: 12px;
        font-weight: 700;
        border-radius: 9999px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 32px;
        font-weight: 800;
        margin: 0 0 16px;
        line-height: 1.2;
      }
      p {
        font-size: 16px;
        color: #5D687A;
        line-height: 1.6;
        margin: 0 0 32px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 9999px;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background-color: #006BFF;
        color: #FFFFFF;
      }
      .btn-primary:hover {
        background-color: #0052CC;
      }
      .btn-outline {
        background-color: #FFFFFF;
        color: #0A1020;
        border: 1px solid #E6EBF2;
      }
      .btn-outline:hover {
        background-color: #F8FAFC;
        border-color: #0052CC;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="badge">Error 404 · Page Not Found</span>
      <h1>Page Not Found</h1>
      <p>The requested URL does not match any registered service division or article. Return to the home page or explore our technical divisions below.</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Return to Home</a>
        <a href="/services" class="btn btn-outline">Explore Services</a>
        <a href="/contact" class="btn btn-outline">Contact Us</a>
      </div>
    </div>
  </body>
</html>
